name: Setup League Client

on:
  workflow_dispatch:

jobs:
  setup-league-client:
    runs-on: windows-latest
    steps:
      - name: Setup League Client
        id: league-client
        uses: magisteriis/setup-league-client@v1
        with:
          username: ${{ secrets.LOL_USERNAME }}
          password: ${{ secrets.LOL_PASSWORD }}
          region: EUW
